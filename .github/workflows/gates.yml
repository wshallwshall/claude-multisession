# The repository's own gates, run on every push and pull request.
#
# WHY THIS FILE EXISTS. This repo publishes documents about CI discipline while running none of it:
# every gate here was an honour-system local command until now, and a stale generated file shipped
# once because nothing checked. A standard whose own repository does not run it is a claim, not a
# control -- which is the failure its documents are about.
#
# WHAT IT DOES NOT DO. It does not run `ccx doctor`. The doctor fires each control on purpose,
# including ones that need a live second session and a peer worktree, and the installers refuse to
# run inside an agent session by design. A CI run that skipped those paths and reported green would
# be a worse signal than not running it at all. The doctor stays a local, plain-terminal command.
#
# See docs/CI-AND-STANDARDS.md for the reasoning behind the shape of this file.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  # One run per ref. A newer push makes an in-flight run irrelevant, and several sessions push here.
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Windows-first tooling, but the gates themselves are portable and the README says so. Running
    # both proves that claim instead of asserting it -- and Windows is where the paths are exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit SHA, not by tag: a tag is mutable and this repo's dependency standard says
      # to pin what you cannot audit. actions/checkout v4.
      #
      # fetch-depth: 0 is LOAD-BEARING, not a default anyone forgot to trim. The default is 1, and
      # `test_rule_ids_are_stable.py` derives "which rule identifiers have ever existed" from the
      # history of one file -- that is what stops a retired identifier being silently reissued to a
      # different rule. On a shallow clone that check reads one revision, so it raises rather than
      # passing quietly. Trimming this back turns the whole suite red with an explanation, which is
      # the correct failure and not a puzzle.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Versions actually used
        shell: pwsh
        run: |
          "pwsh   : $($PSVersionTable.PSVersion)"
          "python : $(python --version)"
          "git    : $(git --version)"

      # RECEIPTS, not assurances. Each gate below prints what it examined. A check that reports only
      # pass/fail cannot be distinguished from one that examined nothing.
      - name: ASCII gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/quality/check-ascii.ps1 -MaxReport 0

      - name: Leak gate (structural-only unless a token source is supplied)
        shell: bash
        env:
          # Optional. Set repository secret CCX_FORBIDDEN_TOKENS to arm the private-name detectors.
          # Without it the gate runs STRUCTURAL-ONLY: shape detectors armed, name detectors empty.
          # That is a legitimate posture and the gate says so on every line of its own output -- but
          # a green run then proves much less, so this step states it rather than letting a tick imply
          # more than it earned.
          CCX_TOKENS: ${{ secrets.CCX_FORBIDDEN_TOKENS }}
        run: |
          set -euo pipefail
          if [ -n "${CCX_TOKENS:-}" ]; then
            printf '%s\n' "$CCX_TOKENS" > "$RUNNER_TEMP/tokens.txt"
            echo "ARMED: a token source was supplied; private-name detectors are on."
            CCX_FORBIDDEN_TOKENS="$RUNNER_TEMP/tokens.txt" python scripts/security/scan_forbidden.py --path . --require-tokens
            rm -f "$RUNNER_TEMP/tokens.txt"
          else
            echo "NOTICE: no token source configured. This run is STRUCTURAL-ONLY --"
            echo "        shape detectors are armed, private-name detectors are NOT."
            echo "        A pass here says nothing about private names. Supply the"
            echo "        CCX_FORBIDDEN_TOKENS secret to arm them."
            python scripts/security/scan_forbidden.py --path .
          fi

      - name: PowerShell parses
        shell: pwsh
        run: |
          # A syntax error in a hook is invisible until the hook is invoked, and a hook that fails to
          # load fails OPEN -- the edit proceeds and nothing reports it. Parse every shipped script.
          $files = Get-ChildItem -Recurse -Include *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](\.git)[\\/]' }
          "parsing $($files.Count) PowerShell file(s)"
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count) {
              $bad++
              "PARSE ERRORS in $($f.FullName):"
              $errs | ForEach-Object { "  $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($bad) { throw "$bad file(s) failed to parse" }
          "all parsed"

      # pandoc, PINNED BY VERSION AND DIGEST. tests/test_word_copies_track_the_markdown.py rebuilds
      # every published standard and compares it against the committed Word copy, so the converter
      # is a dependency of the suite, not an optional extra -- that test FAILS rather than skips
      # when pandoc is missing, because a skip is printed beside the passes and reads as one.
      # Neither runner image ships pandoc, so it is installed here.
      #
      # WHY PINNED, AND NOT "the latest release". The committed .docx were produced by ONE converter.
      # A different one can emit different text from identical markdown, which would redden every
      # document at once on a commit that changed nothing -- and no edit to the markdown would fix
      # it, because the markdown is not what is wrong. An unpinned install makes this gate
      # unsatisfiable at a moment nobody chose. The digests are the ones GitHub reports for the
      # release assets; the version is the one the committed copies were verified against.
      - name: pandoc (pinned, digest verified)
        shell: bash
        run: |
          set -euo pipefail
          version=3.10
          case "$RUNNER_OS" in
            Linux)
              asset="pandoc-${version}-linux-amd64.tar.gz"
              sha=e0f8af62d0f267d22baa5bcefe6d5dda3a097ccc60de794b759fe03159923244
              ;;
            Windows)
              asset="pandoc-${version}-windows-x86_64.zip"
              sha=bb808d00fd58762299d64582a9b4c3e4b106cd929e62c5f19bcdcb496f1e54ae
              ;;
            *)
              echo "no pinned pandoc for RUNNER_OS='$RUNNER_OS'. Refusing to guess: an unverified"
              echo "converter would make the Word-copy comparison meaningless rather than absent."
              exit 1
              ;;
          esac

          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "https://github.com/jgm/pandoc/releases/download/${version}/${asset}"

          # Verified in python rather than with sha256sum, so this step assumes only the interpreter
          # the suite already needs. The digest is PRINTED whether it matches or not -- a check that
          # reports only pass/fail cannot be told apart from one that examined nothing.
          python -c "
          import hashlib, sys
          path, expected = sys.argv[1], sys.argv[2]
          actual = hashlib.sha256(open(path, 'rb').read()).hexdigest()
          print(f'  asset    : {path}')
          print(f'  expected : {expected}')
          print(f'  actual   : {actual}')
          sys.exit(0 if actual == expected else 'DIGEST MISMATCH -- refusing to install this file.')
          " "$asset" "$sha"

          case "$RUNNER_OS" in
            Linux)
              tar xzf "$asset"
              ;;
            Windows)
              # python rather than unzip or 7z: Git Bash ships neither reliably, and the interpreter
              # is already a hard requirement of the step this one exists to feed.
              python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('.')" "$asset"
              ;;
          esac

          # LOCATED, not assumed. The layout inside the archive differs between the platforms and is
          # not promised by the project. Hard-coding it would turn a moved directory into a confusing
          # "pandoc: command not found" two steps later instead of a clear failure here. Plain globs,
          # so this depends on no tool beyond the shell.
          exe=""
          for candidate in ./pandoc-*/bin/pandoc ./pandoc-*/pandoc.exe ./pandoc-*/pandoc; do
            if [ -f "$candidate" ]; then exe="$candidate"; break; fi
          done
          if [ -z "$exe" ]; then
            echo "no pandoc binary found inside ${asset}. Its layout changed; fix this step rather"
            echo "than letting the suite discover the absence as a missing-converter failure."
            exit 1
          fi

          # sed, not head: with `pipefail` set, `head -1` can close the pipe early and fail the step
          # on the very command that proves the install worked.
          "$exe" --version | sed -n '1p'

          bindir="$(cd "$(dirname "$exe")" && pwd)"
          # Windows resolves PATH itself and will not follow a bash-style /d/a/_temp path.
          if [ "$RUNNER_OS" = "Windows" ]; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          cd tests
          # Count what ran. `discover` reporting "Ran 0 tests" is a pass, and a pass over nothing is
          # the exact shape of gate failure these tests were written to catch elsewhere.
          # Output goes to the runner temp dir, never into the working tree.
          out="${RUNNER_TEMP}/test-output.txt"
          python -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee "$out"
          grep -qE '^Ran [1-9][0-9]* tests' "$out" || {
            echo "REFUSING a pass: the runner reported no tests. A green run over an empty set is not evidence."
            exit 1
          }
