# Jekyll configuration for the claude-multisession documentation site.
#
# THIS DIRECTORY IS THE SOURCE ROOT. Every file the site needs -- _config.yml, _data, _layouts,
# assets, index.md -- has to live under docs/, because that is what site-build.yml passes to
# `--source`. A _config.yml at the repository root would be ignored, and the build would still go
# green, so treat the location of this file as load-bearing.

title: claude-multisession
description: >-
  Coordination tooling for running several Claude Code sessions at once against one repository.

# WHERE THIS SITE LIVES, AND WHY IT IS NOT GITHUB PAGES. It was served from
# wshallwshall.github.io/claude-multisession until 2026-08-10. The reader this site is written for
# sits behind a firewall that blocks GitHub WHOLESALE -- not just the Pages host -- so for them the
# documentation did not exist, while every check in this repository stayed green, because nothing
# here can see a network the build does not run on.
#
# THE FIRST VERSION OF THIS COMMENT SAID "only the Pages host is blocked, which is why the source
# links below are unchanged", and that was an inference from one sentence rather than a measurement.
# The owner corrected it on 2026-08-10. It matters more than a comment usually would, because the
# looser reading made the site's own escape hatch look sound: github.com, raw.githubusercontent.com
# and the "Source on GitHub" links in _layouts/default.html are ALL unreachable for the reader this
# site exists for, and the false version said the opposite in writing.
#
# WHAT ACTUALLY REACHES THAT READER, measured on the build of 2026-08-10 rather than assumed: this
# site serves the 16 markdown sources as static files beside the rendered pages, so /CONCEPTS.md is
# readable on the same origin as /CONCEPTS.html. That is the only source path they have. Anything
# that sends a reader to github.com to see a file is a dead end for them, and repointing those is
# open work rather than something this file should imply is done.
#
# baseurl IS EMPTY, AND THAT IS A SETTING RATHER THAN AN OMISSION. On the old host the site sat in a
# subdirectory named after the repository and every href needed that prefix. A Pages project owns
# the whole of its hostname, so the prefix is now the wrong answer and an empty string is the right
# one. Everything still depends on this value: jekyll-relative-links rewrites the intra-docs links
# through relative_url, which prepends it, and the layout builds every nav href and the stylesheet
# href from it. Set it to a path this site is not served under and the pages still render, still go
# green, and 404 every link and asset -- which is exactly how the old value would fail here.
url: https://claude-multisession.pages.dev
baseurl: ""

# Used by the layout instead of site.github.*, which is empty in a local build without a token and
# populated in production -- an instrument that answers a different question depending on where it
# runs.
repo_url: https://github.com/wshallwshall/claude-multisession

markdown: kramdown

# No `plugins:` key on purpose, AND THAT NOW RESTS ON SOMETHING WEAKER THAN IT USED TO.
#
# Three plugins are what make this site work out of markdown that carries no front matter at all --
# every document under docs/ except index.md is a bare .md file:
#   jekyll-optional-front-matter  turns each front-matter-less .md into a rendered page
#   jekyll-relative-links         rewrites ](CONCEPTS.md) to the built URL, with baseurl
#   jekyll-titles-from-headings   sets page.title from the leading H1
#
# They used to arrive because GitHub Pages built this site in safe mode, where the plugin set is a
# fixed allowlist that cannot be configured and therefore cannot be got wrong. They now arrive
# because the Gemfile puts the `github-pages` gem in the :jekyll_plugins group, which bundler
# requires on startup; see that file for why the gem rather than a hand-written list. The result is
# identical and the guarantee is not: under GitHub's builder a missing plugin was impossible, and
# under this one it is one line of the Gemfile away.
#
# THE EDIT THAT BREAKS IT IS NOT IN THIS FILE, which is worth knowing before someone reaches for the
# obvious lever. Measured on 2026-08-10 against this config: adding `plugins: []` changed nothing,
# and neither did building with `--safe`. The gem loads its set through bundler and re-whitelists
# itself, so it is immune to both. Dropping `gem "github-pages"` from the Gemfile is what removes
# them -- and that build EXITED ZERO, printed no warning, and produced ONE page instead of 17.
# That is the whole failure: not an error, a site.
#
# So site-build.yml checks the three by their effects on every run rather than trusting that they
# ran, and that check is armed -- the 1-page build above is what it was fired against. Clean, it
# reports 17 pages from 17 markdown files, each title carrying its file's leading H1 and no
# ](OTHER.md) left unrewritten.

# No `exclude:` key on purpose. Setting it REPLACES Jekyll's defaults rather than adding to them,
# and there is nothing under docs/ that should not be served.

# `include:` IS set, for exactly one file, and it is what makes _redirects reach the site at all.
# Jekyll does not copy a file whose name begins with an underscore -- that is how _layouts and _data
# stay out of the output -- so docs/_redirects would be read by nothing and published nowhere, and
# the forward would be a file in the repository rather than a rule on the host. Cloudflare Pages
# reads _redirects from the root of what is uploaded, which is _site.
#
# This REPLACES Jekyll's default include list, the same trap the exclude comment above describes.
# The default is `[".htaccess"]`, nothing here serves Apache, and no .htaccess is tracked, so the
# replacement costs nothing. Adding a second entry here means writing both.
include:
  - _redirects

# One layout for every page, applied through front-matter defaults so that the 14 existing
# documents keep zero front matter.
#
# TWO MECHANISMS ARE IN PLAY HERE, and the honest description is that they cannot be made to
# disagree rather than that only one runs. jekyll-default-layout is a default plugin and cannot be
# disabled; whether it also assigns a layout to these pages depends on whether its skip test
# consults the lazy front-matter-defaults lookup that Jekyll installs on a page's data hash, which
# is not observable from this repository. So the site is built so that BOTH paths land in the same
# place: this defaults block resolves `layout: default` directly, and _layouts/page.html -- the
# layout jekyll-default-layout would pick for a non-index page -- is a one-line wrapper that chains
# into `default`. Shipping that wrapper is also what removes the dependency on the active theme
# happening to supply an equivalent one.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
