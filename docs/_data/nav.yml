# Sidebar navigation, rendered by _layouts/default.html.
#
# `path` is site-root-relative and does NOT carry the baseurl -- the layout prepends
# {{ site.baseurl }}. It is also what page.url is compared against to mark the current page, so the
# two have to stay in the same form: a docs/FOO.md page is built to /FOO.html, because no permalink
# style is configured in _config.yml. If a permalink style is ever added, every path here changes.
#
# `label` is the short nav name and follows the filename. `title` is the document's own H1 verbatim,
# which is not always the same thing, and is used as the link's title attribute.
#
# An entry with `url` instead of `path` is an absolute link off the site. Those exist because
# INSTALL.md and the scripts live at the repository root, outside the Jekyll source, so the site
# cannot serve them at all.
#
# A page in a SUBDIRECTORY follows the same rule: docs/standards/FOO.md is built to
# /standards/FOO.html. ONE FILENAME BREAKS THAT RULE, which is why a section index would be called
# OVERVIEW.md and not README.md. jekyll-optional-front-matter refuses to convert a front-matter-less
# file whose basename is on its FILENAME_BLACKLIST (README, LICENSE, CONTRIBUTING and friends), so a
# README stays a static file; jekyll-readme-index then republishes it as the DIRECTORY INDEX with
# permalink File.dirname(url) + "/", i.e. /standards/, and the raw .md is served as well. There is no
# /standards/README.html for a nav path to point at. Both plugins are in the GitHub Pages
# always-enabled set and cannot be turned off; the two config keys that would change the behaviour,
# readme_index.with_frontmatter and readme_index.remove_originals, are unset in _config.yml. Naming
# such a file OVERVIEW.md keeps it on the ordinary path, so its URL is predictable and page.url
# matches.
#
# THE GROUPS ARE ORDERED BY WHAT THE READER IS TRYING TO DO, not by what kind of artifact each page
# is. That was the change of 2026-08-16. Before it there were seven groups holding 25 links in which
# a reference page, an installation step and a case study sat side by side, and the reader who had
# just arrived and the reader debugging a merge were offered the same flat list. The order below is
# the order the work happens in: understand it, install it, run a build, keep it honest, look
# something up.

- group: Start here
  items:
    # FIRST ITEM OF THE FIRST GROUP, which is what makes this the first link in the sidebar on every
    # page: _layouts/default.html renders site.data.nav in file order, group by group, and takes the
    # first item of the first group as the first anchor in the nav element. Moving this entry down,
    # or adding a group above this one, silently demotes it -- the layout has no notion of a pinned
    # row, so position in this file is the whole of the mechanism.
    #
    # THIS ROW USED TO BE `The KORUS framework`, AND THE REASON FOR THAT EXPIRED RATHER THAN BEING
    # OVERRULED. That page was pinned first because it was the only page on the site about the
    # method, while the landing page sold the PowerShell tooling. On 2026-08-16 the landing page
    # became the method's own overview, so the framework essay is now the account BEHIND the
    # overview rather than the only route to it, and it sits third -- after the two pages a new
    # reader needs first.
    - label: Overview
      title: KORUS
      path: /
    # SECOND, because the first question is whether to bother. Claude Code ships its own worktrees
    # now and they cover more than they used to, so the FAQ opens by saying which half of this
    # project a reader still needs -- and says plainly when the answer is "none of it".
    - label: FAQ
      title: Frequently asked questions
      path: /FAQ.html
    - label: Quickstart
      title: Quickstart
      path: /QUICKSTART.html
    - label: Run a KORUS build
      title: Run a KORUS build
      path: /KORUS-BUILD.html
    - label: The KORUS framework
      title: "The KORUS framework: Lessons learned the hard way"
      path: /KORUS.html
    - label: Concepts
      title: Concepts
      path: /CONCEPTS.html
    - label: Feed this to Claude Code
      title: Here's what to feed to Claude Code
      path: /FEED-THIS-TO-CLAUDE-CODE.html

